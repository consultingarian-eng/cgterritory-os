<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{APP_NAME}} — Set Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/png" href="/favicon.png?v=6">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=6">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=6">
<!-- PWA -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="{{THEME_COLOR}}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{APP_NAME}}">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=6">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0610;
    --panel: #160d24;
    --border: #2c1a43;
    --ink: #f7eefb;
    --muted: #b8a6cf;
    --dim: #8f7da8;
    --accent: #ec008c;
    --grad: linear-gradient(135deg, #ec008c 0%, #c026a9 50%, #7a2a9e 100%);
    --red: #EF4444;
    --display: 'Space Grotesk', system-ui, sans-serif;
    --sans: 'Inter', system-ui, sans-serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
    background:
      radial-gradient(620px 420px at 15% -5%, rgba(236,0,140,.14), transparent 60%),
      radial-gradient(720px 520px at 100% 105%, rgba(122,42,158,.18), transparent 60%),
      var(--bg);
  }
  ::selection { background: rgba(236,0,140,.35); color: #fff; }

  .card {
    width: 100%;
    max-width: 400px;
    background: linear-gradient(180deg, #1a1029, #120a1e);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 36px;
    box-shadow: 0 40px 90px -30px rgba(236,0,140,.28);
  }

  .card-logo {
    text-align: center;
    margin-bottom: 28px;
  }
  .card-logo img { max-height: 52px; margin-bottom: 14px; filter: drop-shadow(0 4px 16px rgba(236,0,140,.35)); }
  .card-logo h1 { font-family: var(--display); font-size: 21px; font-weight: 700; color: var(--ink); letter-spacing: -.02em; }

  h2 { font-family: var(--display); font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 8px; letter-spacing: -.01em; }
  .subtitle { font-size: 13px; color: var(--muted); margin-bottom: 24px; line-height: 1.5; }

  .form-group { margin-bottom: 18px; }
  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .1em;
    margin-bottom: 8px;
  }
  input[type="password"] {
    width: 100%;
    background: rgba(10,6,16,.6);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: var(--sans);
    color: var(--ink);
    outline: none;
    transition: border-color .15s;
    -webkit-appearance: none;
  }
  input:focus { border-color: var(--accent); }

  .strength {
    display: flex;
    gap: 4px;
    margin-top: 8px;
  }
  .strength-bar { height: 3px; flex: 1; border-radius: 2px; background: var(--border); transition: background .2s; }
  .strength-bar.fill-weak   { background: #EF4444; }
  .strength-bar.fill-fair   { background: #F59E0B; }
  .strength-bar.fill-good   { background: #22C55E; }
  .strength-bar.fill-strong { background: #ec008c; }

  .btn {
    width: 100%;
    background: var(--grad);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    font-family: var(--sans);
    cursor: pointer;
    transition: filter .15s, opacity .15s, transform .2s, box-shadow .2s;
    margin-top: 8px;
    box-shadow: 0 10px 30px -8px rgba(236,0,140,.55);
  }
  .btn:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 14px 36px -8px rgba(236,0,140,.7); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .error-msg {
    background: rgba(239,68,68,.12);
    border: 1px solid rgba(239,68,68,.3);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    color: #FCA5A5;
    margin-bottom: 18px;
    display: none;
  }
  .error-msg.show { display: block; }

  .invalid-state {
    text-align: center;
    padding: 20px 0;
  }
  .invalid-state p { color: var(--muted); font-size: 14px; line-height: 1.6; margin-top: 12px; }
  .invalid-state a { color: var(--accent); text-decoration: none; }

  .footer-credit { margin-top: 32px; font-size: 11px; color: var(--dim); text-align: center; line-height: 1.6; }
  .footer-credit a { color: var(--dim); text-decoration: none; }
</style>
</head>
<body>

<div class="card" id="mainCard">
  <div class="card-logo">
    <img src="{{LOGO}}?v=6" alt="{{ORG_NAME}}">
    <h1>{{APP_NAME}}</h1>
  </div>
  <div id="cardContent">
    <!-- populated by JS -->
  </div>
</div>

<p class="footer-credit">{{APP_NAME}} &mdash; {{ORG_NAME}} &middot; <a href="{{ORG_URL}}">{{ORG_HOST}}</a></p>

<script>
(function(){
  const params = new URLSearchParams(location.search);
  const token  = params.get('token');
  const mode   = params.get('mode') || 'reset'; // 'invite' or 'reset'
  const content = document.getElementById('cardContent');

  if (!token) {
    content.innerHTML = `<div class="invalid-state">
      <p>This link is invalid or has expired.</p>
      <p><a href="/login">Return to sign in</a></p>
    </div>`;
    return;
  }

  const isInvite = mode === 'invite';
  content.innerHTML = `
    <h2>${isInvite ? 'Set your password' : 'Choose a new password'}</h2>
    <p class="subtitle">${isInvite
      ? 'Welcome to {{APP_NAME}}. Set a password to activate your account.'
      : 'Enter a new password for your account.'
    }</p>
    <div class="error-msg" id="errMsg"></div>
    <form id="setForm">
      <div class="form-group">
        <label for="pw1">New password</label>
        <input type="password" id="pw1" autocomplete="new-password" placeholder="Min. 8 characters" required>
        <div class="strength" id="strength">
          <div class="strength-bar" id="sb1"></div>
          <div class="strength-bar" id="sb2"></div>
          <div class="strength-bar" id="sb3"></div>
          <div class="strength-bar" id="sb4"></div>
        </div>
      </div>
      <div class="form-group">
        <label for="pw2">Confirm password</label>
        <input type="password" id="pw2" autocomplete="new-password" placeholder="Re-enter password" required>
      </div>
      <button type="submit" class="btn" id="submitBtn">${isInvite ? 'Activate account' : 'Reset password'}</button>
    </form>
  `;

  // Password strength bars
  document.getElementById('pw1').addEventListener('input', function(){
    const v = this.value;
    const bars = [1,2,3,4].map(i => document.getElementById(`sb${i}`));
    bars.forEach(b => b.className = 'strength-bar');
    if (!v) return;
    let score = 0;
    if (v.length >= 8)  score++;
    if (v.length >= 12) score++;
    if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
    if (/\d/.test(v) && /[^A-Za-z0-9]/.test(v)) score++;
    const cls = ['fill-weak','fill-fair','fill-good','fill-strong'][score-1] || 'fill-weak';
    for (let i = 0; i < score; i++) bars[i].classList.add(cls);
  });

  document.getElementById('setForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const err = document.getElementById('errMsg');
    const pw1 = document.getElementById('pw1').value;
    const pw2 = document.getElementById('pw2').value;
    err.classList.remove('show');

    if (pw1.length < 8) {
      err.textContent = 'Password must be at least 8 characters';
      err.classList.add('show');
      return;
    }
    if (pw1 !== pw2) {
      err.textContent = 'Passwords do not match';
      err.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      const r = await fetch('/api/auth/set-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: pw1, mode }),
      });
      const d = await r.json();
      if (r.ok) {
        location.replace('/');
      } else {
        err.textContent = d.error || 'Failed — please request a new link';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = isInvite ? 'Activate account' : 'Reset password';
      }
    } catch {
      err.textContent = 'Network error — please try again';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = isInvite ? 'Activate account' : 'Reset password';
    }
  });
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
