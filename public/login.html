<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{APP_NAME}} — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/png" href="/favicon.png?v=6">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=6">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=6">
<!-- PWA -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="{{THEME_COLOR}}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{APP_NAME}}">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=6">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0610;
    --panel: #160d24;
    --border: #2c1a43;
    --ink: #f7eefb;
    --muted: #b8a6cf;
    --dim: #8f7da8;
    --accent: #ec008c;
    --grad: linear-gradient(135deg, #ec008c 0%, #c026a9 50%, #7a2a9e 100%);
    --red: #EF4444;
    --green: #22C55E;
    --display: 'Space Grotesk', system-ui, sans-serif;
    --sans: 'Inter', system-ui, sans-serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
    background:
      radial-gradient(620px 420px at 15% -5%, rgba(236,0,140,.14), transparent 60%),
      radial-gradient(720px 520px at 100% 105%, rgba(122,42,158,.18), transparent 60%),
      var(--bg);
  }
  ::selection { background: rgba(236,0,140,.35); color: #fff; }

  .login-card {
    width: 100%;
    max-width: 400px;
    background: linear-gradient(180deg, #1a1029, #120a1e);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 36px;
    box-shadow: 0 40px 90px -30px rgba(236,0,140,.28);
  }

  .login-logo {
    text-align: center;
    margin-bottom: 32px;
  }
  .login-logo img {
    max-height: 56px;
    margin-bottom: 16px;
    filter: drop-shadow(0 4px 16px rgba(236,0,140,.35));
  }
  .login-logo h1 {
    font-family: var(--display);
    font-size: 23px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -.02em;
  }
  .login-logo p {
    font-size: 10px;
    font-weight: 600;
    color: #ff4da6;
    letter-spacing: .2em;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .form-group { margin-bottom: 18px; }
  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .1em;
    margin-bottom: 8px;
  }
  input[type="email"], input[type="password"] {
    width: 100%;
    background: rgba(10,6,16,.6);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: var(--sans);
    color: var(--ink);
    outline: none;
    transition: border-color .15s;
    -webkit-appearance: none;
  }
  input:focus { border-color: var(--accent); }

  .btn {
    width: 100%;
    background: var(--grad);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    font-family: var(--sans);
    cursor: pointer;
    transition: filter .15s, opacity .15s, transform .2s, box-shadow .2s;
    margin-top: 8px;
    box-shadow: 0 10px 30px -8px rgba(236,0,140,.55);
  }
  .btn:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 14px 36px -8px rgba(236,0,140,.7); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .error-msg {
    background: rgba(239,68,68,.12);
    border: 1px solid rgba(239,68,68,.3);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    color: #FCA5A5;
    margin-bottom: 18px;
    display: none;
  }
  .error-msg.show { display: block; }

  .forgot-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    cursor: pointer;
    background: none;
    border: none;
    font-family: var(--sans);
    width: 100%;
  }
  .forgot-link:hover { color: var(--accent); }

  /* Forgot password panel */
  #forgotPanel { display: none; }
  .success-msg {
    background: rgba(34,197,94,.12);
    border: 1px solid rgba(34,197,94,.3);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    color: #86EFAC;
    margin-bottom: 18px;
    display: none;
  }
  .success-msg.show { display: block; }

  .back-link {
    display: block;
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    background: none;
    border: none;
    font-family: var(--sans);
    width: 100%;
    text-decoration: none;
  }
  .back-link:hover { color: var(--ink); }

  .footer-credit {
    margin-top: 32px;
    font-size: 11px;
    color: var(--dim);
    text-align: center;
    line-height: 1.6;
  }
  .footer-credit a { color: var(--dim); text-decoration: none; }
  .footer-credit a:hover { color: var(--muted); }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">
    <img src="{{LOGO}}?v=6" alt="{{ORG_NAME}}">
    <h1>{{APP_NAME}}</h1>
    <p>{{TAGLINE}}</p>
  </div>

  <!-- Sign in panel -->
  <div id="loginPanel">
    <div class="error-msg" id="loginError"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn" id="loginBtn">Sign in</button>
    </form>
    <button class="forgot-link" id="showForgotBtn">Forgot password?</button>
  </div>

  <!-- Forgot password panel -->
  <div id="forgotPanel">
    <div class="success-msg" id="forgotSuccess"></div>
    <div class="error-msg" id="forgotError"></div>
    <form id="forgotForm">
      <div class="form-group">
        <label for="forgotEmail">Your email address</label>
        <input type="email" id="forgotEmail" name="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <button type="submit" class="btn" id="forgotBtn">Send reset link</button>
    </form>
    <button class="back-link" id="backToLoginBtn">← Back to sign in</button>
  </div>
</div>

<p class="footer-credit">{{APP_NAME}} &mdash; {{ORG_NAME}} &middot; <a href="{{ORG_URL}}">{{ORG_HOST}}</a></p>

<script>
(function(){
  // If already authenticated, redirect to app
  fetch('/api/auth/me').then(r => { if (r.ok) location.replace('/'); }).catch(()=>{});

  const loginPanel  = document.getElementById('loginPanel');
  const forgotPanel = document.getElementById('forgotPanel');

  document.getElementById('showForgotBtn').addEventListener('click', () => {
    loginPanel.style.display  = 'none';
    forgotPanel.style.display = 'block';
  });
  document.getElementById('backToLoginBtn').addEventListener('click', () => {
    loginPanel.style.display  = 'block';
    forgotPanel.style.display = 'none';
  });

  // Login form
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginError');
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    err.classList.remove('show');
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email:    document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      const d = await r.json();
      if (r.ok) {
        location.replace('/');
      } else {
        err.textContent = d.error || 'Login failed';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    } catch {
      err.textContent = 'Network error — please try again';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });

  // Forgot password form
  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('forgotBtn');
    const err = document.getElementById('forgotError');
    const suc = document.getElementById('forgotSuccess');
    btn.disabled = true;
    btn.textContent = 'Sending…';
    err.classList.remove('show');
    suc.classList.remove('show');
    try {
      const r = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('forgotEmail').value }),
      });
      const d = await r.json();
      suc.textContent = d.message || 'Reset link sent if that email exists.';
      suc.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Send reset link';
    } catch {
      err.textContent = 'Network error — please try again';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Send reset link';
    }
  });
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
